name: Fast static checks (non-release)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python static/unit subset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.7.12"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - name: pytest (unit only -- integration/isolation need Docker)
        run: uv run pytest -m "not integration and not isolation"

  javascript:
    name: JavaScript static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
