name: ai-fde

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ai_fde
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    volumes:
      - ai_fde_postgres:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_fde"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2025-03-12T18-04-18Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ai-fde-dev
      MINIO_ROOT_PASSWORD: ai-fde-dev-secret
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - ai_fde_minio:/data

volumes:
  ai_fde_postgres:
  ai_fde_minio:
